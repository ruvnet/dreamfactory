[package]
name = "df-database"
version = "0.1.0"
edition = "2021"
description = "DreamFactory Database abstraction layer with multi-provider support"
authors = ["DreamFactory Team"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Database drivers and ORM
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "json",
    "chrono",
    "uuid",
    "migrate",
    "any"
] }
sea-orm = { version = "0.12", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "debug-print"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = "2.0"
regex = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client for URL parsing
url = "2.4"

# Core dependencies (commented out for now since df-core doesn't exist yet)
# df-core = { path = "../df-core" }

[dev-dependencies]
# Testing
tokio-test = "0.4"
testcontainers = "0.15"
serial_test = "3.0"

# Test databases
testcontainers-modules = { version = "0.3", features = ["postgres", "mysql"] }

[[bin]]
name = "db-test"
path = "src/bin/db_test.rs"