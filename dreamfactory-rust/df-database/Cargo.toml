[package]
name = "df-database"
version = "0.1.0"
edition = "2021"
description = "DreamFactory Database abstraction layer with multi-provider support"
authors = ["DreamFactory Team"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
sqlx = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Database-specific dependencies
async-trait = "0.1"
indexmap = "2.0"
regex = "1.0"
url = "2.4"

# Core dependencies (commented out for now since df-core doesn't exist yet)
# df-core = { path = "../df-core" }

[dev-dependencies]
# Testing
tokio-test = "0.4"
testcontainers = "0.15"
serial_test = "3.0"

# Test databases
testcontainers-modules = { version = "0.3", features = ["postgres", "mysql"] }

[[bin]]
name = "db-test"
path = "src/bin/db_test.rs"