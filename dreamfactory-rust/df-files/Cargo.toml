[package]
name = "df-files"
version = "0.1.0"
edition = "2021"
description = "DreamFactory file services with local and cloud storage support"
authors = ["DreamFactory Software <info@dreamfactory.com>"]
license = "Apache-2.0"

[dependencies]
# Core dependencies from workspace
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }

# File and cloud storage
object_store = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
reqwest = { workspace = true }

# File operations
bytes = "1.5"
futures = "0.3"
mime = "0.3"
mime_guess = "2.0"
tempfile = "3.8"
walkdir = "2.4"
tokio-util = { version = "0.7", features = ["codec"] }
filetime = "0.2"

# Async traits
async-trait = "0.1"

# Error handling and utilities
once_cell = "1.19"
url = "2.5"

# Configuration
figment = { workspace = true }

# Internal dependencies
# df-core = { path = "../df-core" }

[dev-dependencies]
mockall = { workspace = true }
wiremock = { workspace = true }
criterion = { workspace = true }
tokio-test = "0.4"
test-case = "3.3"
rstest = "0.18"

# [[bench]]
# name = "file_operations"
# harness = false

[features]
default = ["local", "s3", "azure", "gcp"]
local = []
s3 = []
azure = []
gcp = []
testing = []